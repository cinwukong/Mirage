name: Build the Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Mirage and its installer
        shell: pwsh
        run: ./installer/build.ps1

      # The files installed copies update from (updater.py): the app exactly as the installer ships it, plus
      # mirage-update.json with its checksum. They go on the release next to the installer.
      - name: Make the update files
        shell: pwsh
        run: |
          python release_tool.py pack build/Mirage/app installer/out/update
          if ($LASTEXITCODE -ne 0) { throw "Making the update files failed" }
          python release_tool.py verify installer/out/update
          if ($LASTEXITCODE -ne 0) { throw "The update files don't check out" }

      - uses: actions/upload-artifact@v4
        with:
          name: Mirage-Setup
          path: installer/out/*.exe
          if-no-files-found: error

      # A new version on main (version.txt) gets its own release with the installer, automatically
      - name: Is this a new version?
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT; Write-Host "v$v is already released" }
          else { "new=true" >> $env:GITHUB_OUTPUT; Write-Host "v$v is new" }
          $global:LASTEXITCODE = 0

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mirage ${{ steps.ver.outputs.version }}
          make_latest: true
          files: |
            installer/out/*.exe
            installer/out/update/*
          body: |
            **Download `Mirage-Setup-*.exe` below and run it.** Windows 10 or 11, 64-bit.

            Windows may say it protected your PC, because the installer isn't signed: click **More info**, then **Run anyway**.
            After installing, Mirage walks you through your microphone, its voice (about 830 MB) and its brain.

      # Keeps the build log on the ci-logs branch, so it can be read without signing in to GitHub
      - name: Save the build log
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci | Out-Null
          foreach ($f in @("build/build.log", "build/selftest.txt")) { if (Test-Path $f) { Copy-Item $f ci/ } }
          "${{ job.status }} run ${{ github.run_number }} ${{ github.ref_name }} ${{ github.sha }} $(Get-Date -Format o)" | Set-Content ci/status.txt
          Set-Location ci
          git init -q
          git config user.name "mirage-ci"
          git config user.email "mirage-ci@users.noreply.github.com"
          git checkout -q -b ci-logs
          git add -A
          git commit -q -m "Build log, run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
